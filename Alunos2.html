<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal dos Alunos - Cards</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-color);
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Formulário */
        .form-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .form-section h2 {
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }

        /* Grade de Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary-color);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Estilo da Foto */
        .card-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 3px solid #e5e7eb;
        }

        .card h3 {
            margin-bottom: 0.2rem;
            color: var(--text-color);
            font-size: 1.2rem;
        }

        .card .course {
            font-size: 0.8rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .card .bio {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #4b5563;
            margin-bottom: 1.5rem;
            flex-grow: 1; /* Empurra o botão de link para o final do card */
        }

        /* Botão da Página Pessoal */
        .card .profile-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #f3f4f6;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid #e5e7eb;
            width: 100%;
        }

        .card .profile-link:hover {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal de Alunos</h1>
        <p>Conheça os estudantes da nossa comunidade ou adicione o seu card!</p>
    </header>

    <div class="container">
        <!-- Seção do Formulário -->
        <section class="form-section">
            <h2>Criar Meu Card</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" required placeholder="Ex: Maria Silva">
                </div>
                <div class="form-group">
                    <label for="course">Curso / Turma</label>
                    <input type="text" id="course" required placeholder="Ex: Análise de Sistemas">
                </div>
                <div class="form-group">
                    <label for="photo">URL da Foto (opcional)</label>
                    <input type="url" id="photo" placeholder="https://linkdaimagem.com">
                </div>
                <div class="form-group">
                    <label for="website">Página Pessoal ou LinkedIn (opcional)</label>
                    <input type="url" id="website" placeholder="https://linkedin.com">
                </div>
                <div class="form-group">
                    <label for="bio">Sobre Mim</label>
                    <textarea id="bio" required placeholder="Conte um pouco sobre suas habilidades e interesses..."></textarea>
                </div>
                <button type="submit">Publicar Card</button>
            </form>
        </section>

        <!-- Seção onde os Cards vão aparecer -->
        <main class="cards-grid" id="cardsGrid">
            <!-- Card de Exemplo -->
            <div class="card">
                <img src="https://unsplash.com" alt="Foto de Alex" class="card-img">
                <h3>Alex Souza</h3>
                <div class="course">Engenharia de Software</div>
                <p class="bio">Apaixonado por desenvolvimento web, JavaScript e automação. No tempo livre, gosto de jogar xadrez.</p>
                <a href="https://github.com" target="_blank" class="profile-link">Visitar Página</a>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById('studentForm');
        const grid = document.getElementById('cardsGrid');
        
        // Imagem padrão caso o aluno não coloque nenhuma URL
        const defaultPhoto = "https://flaticon.com";

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const course = document.getElementById('course').value;
            const photo = document.getElementById('photo').value || defaultPhoto;
            const website = document.getElementById('website').value;
            const bio = document.getElementById('bio').value;

            const newCard = document.createElement('div');
            newCard.classList.add('card');

            // Monta o HTML interno do card
            let cardHTML = `
                <img src="${photo}" alt="Foto de ${name}" class="card-img" onerror="this.src='${defaultPhoto}'">
                <h3>${name}</h3>
                <div class="course">${course}</div>
                <p class="bio">${bio}</p>
            `;

            // Só adiciona o botão de link se o usuário tiver preenchido o campo
            if (website) {
                cardHTML += `<a href="${website}" target="_blank" class="profile-link">Visitar Página</a>`;
            }

            newCard.innerHTML = cardHTML;
            grid.insertBefore(newCard, grid.firstChild);
            form.reset();
        });
    </script>
</body>
</html>
